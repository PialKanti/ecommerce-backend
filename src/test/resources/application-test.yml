spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ecommerce_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  flyway:
    enabled: true
    locations: classpath:db/test-migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mvc:
    problemdetails:
      enabled: true

stripe:
  api-key: sk_test_dummy
  success-url: http://localhost:8080/api/v1/payments/success?session_id={CHECKOUT_SESSION_ID}
  cancel-url: http://localhost:8080/api/v1/payments/failed?session_id={CHECKOUT_SESSION_ID}
  currency: bdt
